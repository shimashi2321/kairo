<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回路ドリル - 第二種電気工事士 対策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E6;
    --grid:rgba(46,92,138,0.07);
    --card:#FFFDF8;
    --ink:#2B2A26;
    --muted:#78715F;
    --wire:#1E1E1E;
    --red:#C0392B;
    --blue:#2E5C8A;
    --amber:#D9A441;
    --amber-dark:#B9852A;
    --good:#3F7D4C;
    --good-bg:#E9F3EA;
    --bad:#B33A3A;
    --bad-bg:#FBEBEA;
    --line:#DDD5C2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 28px);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{margin-bottom:18px;}
  .kicker{font-size:13px;color:var(--muted);letter-spacing:.04em;margin:0 0 4px;}
  h1{font-family:"Shippori Mincho", serif;font-weight:700;font-size:26px;margin:0 0 6px;line-height:1.4;}
  .lede{color:var(--muted);font-size:14px;line-height:1.7;margin:0;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 1px 0 rgba(0,0,0,.03), 0 12px 24px -18px rgba(43,42,38,.35);
    padding:26px 24px 24px;
    margin-top:22px;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;top:0;left:22px;right:22px;height:6px;
    background:repeating-linear-gradient(90deg, var(--amber) 0 14px, transparent 14px 22px);
    opacity:.55;
  }

  .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .toprow .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:100px;}
  .score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .score b{color:var(--ink);}

  .type-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .type-btn{
    flex:1 1 auto;
    min-width:130px;
    font-family:"Shippori Mincho", serif;
    font-size:14px;
    padding:10px 8px;
    border-radius:4px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--muted);
    cursor:pointer;
    text-align:center;
  }
  .type-btn:hover{border-color:var(--amber);}
  .type-btn.active{
    border-color:var(--amber-dark);
    background:#2B2A26;
    color:#F5F1E6;
    font-weight:700;
  }

  .mode-picker{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .mode-btn{
    font-family:inherit;font-size:12.5px;padding:7px 12px;border-radius:100px;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;
  }
  .mode-btn:hover{border-color:var(--amber);}
  .mode-btn.active{border-color:var(--amber-dark);background:#FDF6E8;color:var(--ink);font-weight:700;}

  .diagram-wrap{margin:14px 0 6px;display:flex;justify-content:center;}
  svg{max-width:100%;height:auto;}

  .given{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13.5px;margin:6px 0 22px;color:var(--muted);}
  .given b{color:var(--ink);font-variant-numeric:tabular-nums;}

  .qrow{border-top:1px dashed var(--line);padding:16px 0;}
  .qrow:first-of-type{border-top:1px solid var(--line);}
  .qlabel{font-family:"Shippori Mincho", serif;font-size:16px;font-weight:700;margin-bottom:10px;}

  .choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  @media (max-width:480px){.choices{grid-template-columns:repeat(2,1fr);}}
  .choice{
    border:1.5px solid var(--line);border-radius:4px;padding:10px 6px;
    text-align:center;font-size:15px;font-variant-numeric:tabular-nums;
    cursor:pointer;background:#fff;transition:border-color .12s, background .12s;
    user-select:none;position:relative;
  }
  .choice input{position:absolute;opacity:0;pointer-events:none;}
  .choice:hover{border-color:var(--amber);}
  .choice.selected{border-color:var(--amber-dark);background:#FDF6E8;font-weight:700;}
  .choice.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700;}
  .choice.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700;}

  .explain{
    margin-top:10px;font-size:13px;color:var(--muted);
    background:#FAF7EF;border-left:3px solid var(--amber);
    padding:8px 12px;display:none;line-height:1.6;
  }
  .explain.show{display:block;}

  .actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
  button{font-family:inherit;font-size:14px;font-weight:700;border-radius:4px;padding:11px 22px;cursor:pointer;border:1.5px solid transparent;}
  .btn-primary{background:var(--amber);color:#2B2A26;border-color:var(--amber-dark);}
  .btn-primary:hover{background:var(--amber-dark);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--muted);}

  .result-banner{text-align:center;margin-top:16px;font-size:14px;font-weight:700;display:none;}
  .result-banner.show{display:block;}
  .result-banner.all-good{color:var(--good);}
  .result-banner.has-bad{color:var(--bad);}

  footer{text-align:center;font-size:12px;color:var(--muted);margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">第二種電気工事士 学科対策</p>
    <h1>回路ドリル — 数値を求めよ</h1>
    <p class="lede">直流(直列・並列)と交流(R-L直列・R-X並列)の回路を、オームの法則から数値を求める形式で練習できます。消費電力(W)の問題も含みます(無効電力・皮相電力は範囲外のため扱いません)。回路タイプと出題パターンを選んで、選択肢から正しい答えを選んでください。</p>
  </header>

  <div class="card">
    <div class="toprow">
      <span class="tag" id="modeTag">直流回路</span>
      <span class="score">正解 <b id="scoreCorrect">0</b> / <span id="scoreTotal">0</span> 問</span>
    </div>

    <div class="type-picker" id="typePicker"></div>
    <div class="mode-picker" id="modePicker"></div>

    <div class="diagram-wrap">
      <svg id="circuitSvg" viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="given" id="givenValues"></div>

    <div id="questionRows"></div>

    <div class="result-banner" id="resultBanner"></div>

    <div class="actions">
      <button class="btn-primary" id="checkBtn">採点する</button>
      <button class="btn-ghost" id="nextBtn">次の問題</button>
    </div>
  </div>

  <footer>V=IR · P=VI=I²R · 直列:電流一定/E=V1+V2 · 並列:電圧一定/I=I1+I2 · 交流直列:Z²=R²+X² · 交流並列:I²=IR²+IX²</footer>
</div>

<script>
(function(){
  const UNITS = {
    E:'V', I:'A', I1:'A', I2:'A', R1:'&#937;', R2:'&#937;', V1:'V', V2:'V',
    R:'&#937;', X:'&#937;', Z:'&#937;', VR:'V', VX:'V',
    W1:'W', W2:'W', W:'W', IR:'A', IX:'A', PF:'%',
    Vline:'V', Vphase:'V', Iphase:'A', Iline:'A'
  };
  const FIELD_META = {
    I1:{label:'I&#8321;', unit:'A'},
    I2:{label:'I&#8322;', unit:'A'},
    I:{label:'I', unit:'A'},
    E:{label:'E', unit:'V'},
    V1:{label:'V&#8321;', unit:'V'},
    V2:{label:'V&#8322;', unit:'V'},
    R1:{label:'R&#8321;', unit:'&#937;'},
    R2:{label:'R&#8322;', unit:'&#937;'},
    R:{label:'R', unit:'&#937;'},
    X:{label:'X', unit:'&#937;'},
    Z:{label:'Z', unit:'&#937;'},
    VR:{label:'V<sub>R</sub>', unit:'V'},
    VX:{label:'V<sub>X</sub>', unit:'V'},
    W1:{label:'W&#8321;', unit:'W'},
    W2:{label:'W&#8322;', unit:'W'},
    W:{label:'W', unit:'W'},
    IR:{label:'I<sub>R</sub>', unit:'A'},
    IX:{label:'I<sub>X</sub>', unit:'A'},
    PF:{label:'cosθ(力率)', unit:'%'},
    Vline:{label:'V<sub>L</sub>', unit:'V'},
    Vphase:{label:'V<sub>P</sub>', unit:'V'},
    Iphase:{label:'I<sub>P</sub>', unit:'A'},
    Iline:{label:'I<sub>L</sub>', unit:'A'}
  };

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function pickExcept(arr, excl){
    const filtered = arr.filter(v => !excl.includes(v));
    return pick(filtered.length ? filtered : arr);
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function uniqPositive(arr){
    return Array.from(new Set(arr.filter(v => v!==null && v!==undefined && v>0 && Number.isFinite(v))));
  }
  function numericDistractors(correct, siblings){
    let pool = uniqPositive([
      ...siblings, correct*2, correct+1, correct-1, correct+2, correct-2,
      correct%2===0 ? correct/2 : null
    ]).filter(v => v!==correct);
    const extra = [correct+4, correct-4, correct+3, correct-3, correct*3];
    let i=0;
    while(pool.length < 3 && i < extra.length){
      const v = extra[i];
      if(v>0 && v!==correct && !pool.includes(v)) pool.push(v);
      i++;
    }
    return shuffle(pool).slice(0,3);
  }

  // ---------- SERIES (DC) ----------
  const SERIES_RES = [2,3,4,5,6,8,10,12];
  const SERIES_I = [1,2,3,4,5,6,8];

  const SERIES = {
    typeName:'直流・直列回路', shortName:'直列回路(直流)',
    labels: {E:'電源電圧', I:'電流', R1:'抵抗R1', R2:'抵抗R2', V1:'V1(電圧降下)', V2:'V2(電圧降下)', W1:'消費電力W1', W2:'消費電力W2', W:'消費電力'},
    templates: [
      { id:'V2', name:'電圧(V2)を求める', diagramMode:'split', given:['E','I','V1'], ask:['I1','I2','V2'] },
      { id:'E',  name:'電源電圧(E)をマスク', diagramMode:'single', given:['I','R1','R2'], ask:['V1','V2','E'] },
      { id:'I',  name:'電流(I)をマスク', diagramMode:'single', given:['E','R1','R2'], ask:['I','V1','V2'] },
      { id:'R',  name:'オーム値(R1・R2)を導く', diagramMode:'single', given:['E','I','V1'], ask:['R1','R2','V2'] },
      { id:'W',  name:'消費電力(W)を求める', diagramMode:'single', given:['E','R1','R2'], ask:['I','W1','W2'] }
    ],
    explain: {
      V2:{
        I1: v=>`直列回路ではどの点でも電流は同じなので、I&#8321; = I = ${v.I}A です。`,
        I2: v=>`同じ理由で I&#8322; = I = ${v.I}A です。`,
        V2: v=>`電源電圧は各抵抗の電圧降下の和になるので、V&#8322; = E − V&#8321; = ${v.E} − ${v.V1} = ${v.V2}V です。`
      },
      E:{
        V1: v=>`オームの法則より V&#8321; = I × R&#8321; = ${v.I} × ${v.R1} = ${v.V1}V です。`,
        V2: v=>`同様に V&#8322; = I × R&#8322; = ${v.I} × ${v.R2} = ${v.V2}V です。`,
        E: v=>`直列回路の電源電圧は各抵抗の電圧降下の和になるので、E = V&#8321; + V&#8322; = ${v.V1} + ${v.V2} = ${v.E}V です。`
      },
      I:{
        I: v=>`直列回路の合成抵抗は R&#8321;+R&#8322; なので、オームの法則より I = E ÷ (R&#8321;+R&#8322;) = ${v.E} ÷ (${v.R1}+${v.R2}) = ${v.I}A です。`,
        V1: v=>`オームの法則より V&#8321; = I × R&#8321; = ${v.I} × ${v.R1} = ${v.V1}V です。`,
        V2: v=>`同様に V&#8322; = I × R&#8322; = ${v.I} × ${v.R2} = ${v.V2}V です。`
      },
      R:{
        R1: v=>`オームの法則より R&#8321; = V&#8321; ÷ I = ${v.V1} ÷ ${v.I} = ${v.R1}&#937; です。`,
        R2: v=>`V&#8322; = E − V&#8321; = ${v.E} − ${v.V1} = ${v.V2}V なので、R&#8322; = V&#8322; ÷ I = ${v.V2} ÷ ${v.I} = ${v.R2}&#937; です。`,
        V2: v=>`電源電圧は各抵抗の電圧降下の和になるので、V&#8322; = E − V&#8321; = ${v.E} − ${v.V1} = ${v.V2}V です。`
      },
      W:{
        I: v=>`直列回路の合成抵抗は R&#8321;+R&#8322; なので、オームの法則より I = E ÷ (R&#8321;+R&#8322;) = ${v.E} ÷ (${v.R1}+${v.R2}) = ${v.I}A です。`,
        W1: v=>`消費電力は P=I²R で求められるので、W&#8321; = I² × R&#8321; = ${v.I}² × ${v.R1} = ${v.W1}W です。`,
        W2: v=>`同様に W&#8322; = I² × R&#8322; = ${v.I}² × ${v.R2} = ${v.W2}W です。`
      }
    },
    gen(){
      const R1 = pick(SERIES_RES);
      const R2 = pickExcept(SERIES_RES, [R1]);
      const I = pick(SERIES_I);
      const V1 = I*R1, V2 = I*R2, E = V1+V2;
      const W1 = I*I*R1, W2 = I*I*R2, W = W1+W2;
      return { E, I, R1, R2, V1, V2, I1:I, I2:I, W1, W2, W };
    },
    siblings(field, v){
      switch(field){
        case 'E': return [v.V1, v.V2, Math.abs(v.V1-v.V2)];
        case 'V1': return [v.E, v.V2];
        case 'V2': return [v.E, v.V1];
        case 'R1': return [v.R2];
        case 'R2': return [v.R1];
        case 'W1': return [v.W2];
        case 'W2': return [v.W1];
        case 'W': return [v.W1, v.W2];
        default: return [];
      }
    },
    renderSvg(svg, template, v){
      const mode = template.diagramMode;
      const disp = (k,u) => template.given.includes(k) ? v[k]+u : (template.ask.includes(k) ? '?' : '');

      let currentSvg = '';
      if(mode === 'split'){
        currentSvg = `
          <text x="100" y="48" font-size="16" font-weight="700" fill="var(--red)">I=${disp('I','A')}</text>
          <line x1="100" y1="55" x2="150" y2="55" stroke="var(--red)" stroke-width="2.5" marker-end="url(#arrowRed)"/>
          <text x="270" y="48" font-size="16" font-weight="700" fill="var(--red)">I&#8321;=${disp('I1','A')}</text>
          <line x1="270" y1="55" x2="320" y2="55" stroke="var(--red)" stroke-width="2.5" marker-end="url(#arrowRed)"/>
          <text x="460" y="48" font-size="16" font-weight="700" fill="var(--red)">I&#8322;=${disp('I2','A')}</text>
          <line x1="460" y1="55" x2="510" y2="55" stroke="var(--red)" stroke-width="2.5" marker-end="url(#arrowRed)"/>
        `;
      } else {
        currentSvg = `
          <text x="90" y="48" font-size="16" font-weight="700" fill="var(--red)">I=${disp('I','A')}</text>
          <line x1="90" y1="55" x2="520" y2="55" stroke="var(--red)" stroke-width="2.5" marker-end="url(#arrowRed)"/>
        `;
      }

      const r1Annot = `<text x="210" y="45" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">R&#8321;=${disp('R1','&#937;')}</text>`;
      const r2Annot = `<text x="400" y="45" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">R&#8322;=${disp('R2','&#937;')}</text>`;
      const showRAnnot = mode === 'single' || template.id === 'W';

      svg.setAttribute('viewBox','0 0 620 260');
      svg.innerHTML = `
        <polyline points="80,70 540,70 540,200 80,200 80,70" fill="none" stroke="var(--wire)" stroke-width="3"/>
        <line x1="80" y1="95" x2="80" y2="115" stroke="var(--wire)" stroke-width="4"/>
        <line x1="70" y1="115" x2="90" y2="115" stroke="var(--wire)" stroke-width="4"/>
        <line x1="74" y1="123" x2="86" y2="123" stroke="var(--wire)" stroke-width="7"/>
        <text x="40" y="145" font-size="17" font-weight="700" fill="var(--ink)" font-family="Shippori Mincho, serif">E=${disp('E','V')}</text>

        <rect x="170" y="55" width="80" height="30" fill="#fff" stroke="var(--wire)" stroke-width="2.5"/>
        <text x="210" y="76" font-size="16" font-weight="700" text-anchor="middle" fill="var(--ink)">R1</text>
        ${showRAnnot ? r1Annot : ''}

        <rect x="360" y="55" width="80" height="30" fill="#fff" stroke="var(--wire)" stroke-width="2.5"/>
        <text x="400" y="76" font-size="16" font-weight="700" text-anchor="middle" fill="var(--ink)">R2</text>
        ${showRAnnot ? r2Annot : ''}

        ${currentSvg}

        <line x1="170" y1="95" x2="170" y2="115" stroke="var(--blue)" stroke-width="2"/>
        <line x1="250" y1="95" x2="250" y2="115" stroke="var(--blue)" stroke-width="2"/>
        <line x1="180" y1="108" x2="240" y2="108" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
        <text x="210" y="130" font-size="14" font-weight="700" text-anchor="middle" fill="var(--blue)">V&#8321;=${disp('V1','V')}</text>

        <line x1="360" y1="95" x2="360" y2="115" stroke="var(--blue)" stroke-width="2"/>
        <line x1="440" y1="95" x2="440" y2="115" stroke="var(--blue)" stroke-width="2"/>
        <line x1="370" y1="108" x2="430" y2="108" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
        <text x="400" y="130" font-size="14" font-weight="700" text-anchor="middle" fill="var(--blue)">V&#8322;=${disp('V2','V')}</text>

        <defs>
          <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--red)"/></marker>
          <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--blue)"/></marker>
        </defs>
      `;
    }
  };

  // ---------- PARALLEL (DC) ----------
  const PARALLEL_RES = [2,3,4,5,6,8,10,12,15,20,24,30];
  const PARALLEL_I = [1,2,3,4,5,6,8,10];

  const PARALLEL = {
    typeName:'直流・並列回路', shortName:'並列回路(直流)',
    labels: {E:'電源電圧', I:'全電流', I1:'枝電流I1', I2:'枝電流I2', R1:'抵抗R1', R2:'抵抗R2', V1:'V1(枝の電圧)', V2:'V2(枝の電圧)', W1:'消費電力W1', W2:'消費電力W2', W:'消費電力'},
    templates: [
      { id:'BASE', name:'全電流・電源電圧を求める', given:['V1','I1','I2'], ask:['I','E','V2'] },
      { id:'E',    name:'電源電圧(E)をマスク',      given:['R1','R2','I1'], ask:['E','V2','I2'] },
      { id:'I',    name:'各枝電流をマスク',         given:['E','R1','R2'], ask:['I1','I2','I'] },
      { id:'R',    name:'オーム値(R1・R2)を導く',   given:['E','I1','I2'], ask:['R1','R2','I'] },
      { id:'W',    name:'消費電力(W)を求める',      given:['E','R1','R2'], ask:['I1','I2','W'] }
    ],
    explain: {
      BASE:{
        I: v=>`並列回路の全電流は各枝電流の和になるので、I = I&#8321;+I&#8322; = ${v.I1}+${v.I2} = ${v.I}A です。`,
        E: v=>`並列回路では電源電圧と各枝の電圧は等しいので、E = V&#8321; = ${v.V1}V です。`,

    return shuffle([correct, ...wrongs]);

    renderQuestions();
    const banner = document.getElementById('resultBanner');
    banner.classList.remove('show','all-good','has-bad');
  }

  function renderGiven(){
    const t = state.template, v = state.values, labels = spec().labels;
    document.getElementById('givenValues').innerHTML =
      t.given.map(k => `<span>${labels[k]} <b>${k}=${v[k]}${UNITS[k]}</b></span>`).join('');
  }

  function renderQuestions(){
    const wrap = document.getElementById('questionRows');
    wrap.innerHTML = '';
    state.template.ask.forEach(field => {
      const meta = FIELD_META[field];
      const row = document.createElement('div');
      row.className = 'qrow';
      row.dataset.field = field;
      const choicesHtml = state.options[field].map(val => `
        <label class="choice" data-value="${val}">
          <input type="radio" name="${field}" value="${val}">
          <span>${val}${meta.unit}</span>
        </label>
      `).join('');
      row.innerHTML = `
        <div class="qlabel">${meta.label} = </div>
        <div class="choices">${choicesHtml}</div>
        <div class="explain" id="explain-${field}"></div>
      `;
      wrap.appendChild(row);
    });

    wrap.querySelectorAll('.choice').forEach(label => {
      label.addEventListener('click', () => {
        if(state.checked) return;
        const row = label.closest('.qrow');
        row.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
        label.classList.add('selected');
        label.querySelector('input').checked = true;
      });
    });
  }

  function checkAnswers(){
    if(state.checked) return;
    let allGood = true, answeredAny = false;

    state.template.ask.forEach(field => {
      const row = document.querySelector(`.qrow[data-field="${field}"]`);
      const selected = row.querySelector('input:checked');
      const correct = state.values[field];
      const explain = document.getElementById(`explain-${field}`);
      explain.innerHTML = spec().explain[state.template.id][field](state.values);
      explain.classList.add('show');

      row.querySelectorAll('.choice').forEach(choice => {
        const val = Number(choice.dataset.value);
        choice.classList.remove('selected');
        if(val === correct) choice.classList.add('correct');
        else if(selected && Number(selected.value) === val) choice.classList.add('wrong');
      });

      if(selected){
        answeredAny = true;
        if(Number(selected.value) !== correct) allGood = false;
      } else {
        allGood = false;
      }
    });

    if(answeredAny){
      scoreTotal += 1;
      if(allGood) scoreCorrect += 1;
      document.getElementById('scoreCorrect').textContent = scoreCorrect;
      document.getElementById('scoreTotal').textContent = scoreTotal;
    }

    const banner = document.getElementById('resultBanner');
    banner.textContent = allGood ? '全問正解です。' : '不正解の項目があります。緑色が正しい答えです。';
    banner.classList.add('show', allGood ? 'all-good' : 'has-bad');
    state.checked = true;
  }

  function renderTypePicker(){
    const wrap = document.getElementById('typePicker');
    wrap.innerHTML = Object.keys(SPECS).map(key =>
      `<button type="button" class="type-btn${key===circuitType?' active':''}" data-type="${key}">${SPECS[key].shortName}</button>`
    ).join('');
    wrap.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if(btn.dataset.type === circuitType) return;
        circuitType = btn.dataset.type;
        selectedModeId = 'RANDOM';
        renderTypePicker();
        renderModePicker();
        newProblem();
      });
    });
  }

  function renderModePicker(){
    const wrap = document.getElementById('modePicker');
    const modes = [{id:'RANDOM', name:'ランダム'}, ...spec().templates.map(t => ({id:t.id, name:t.name}))];
    wrap.innerHTML = modes.map(m =>
      `<button type="button" class="mode-btn${m.id===selectedModeId?' active':''}" data-mode="${m.id}">${m.name}</button>`
    ).join('');
    wrap.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedModeId = btn.dataset.mode;
        wrap.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        newProblem();
      });
    });
  }

  document.getElementById('checkBtn').addEventListener('click', checkAnswers);
  document.getElementById('nextBtn').addEventListener('click', newProblem);

  renderTypePicker();
  renderModePicker();
  newProblem();
})();
</script>
</body>
</html>
